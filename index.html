<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe — Minimalist</title>
  <meta name="description" content="A functional, beautifully crafted Tic-Tac-Toe web game with minimalist design aesthetics, smart AI, sound synthesis, and smooth animations.">
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow -->
  <div class="ambient-bg" aria-hidden="true"></div>

  <main class="app-card">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="title-wrap">
          <span class="brand-tag">Minimalist</span>
          <h1 class="game-title">Tic Tac Toe</h1>
        </div>

        <!-- Sound Toggle -->
        <button id="sound-btn" class="icon-btn" type="button" aria-label="Toggle sound" title="Toggle sound">
          <svg class="sound-on-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="sound-off-icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- Mode Selector (PvP vs PvAI) -->
      <div class="mode-switch" role="tablist" aria-label="Game Mode">
        <button id="mode-pvp" class="mode-btn active" role="tab" aria-selected="true" data-mode="pvp">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>2 Players</span>
        </button>
        <button id="mode-ai" class="mode-btn" role="tab" aria-selected="false" data-mode="ai">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16"></line>
            <line x1="16" y1="16" x2="16.01" y2="16"></line>
          </svg>
          <span>vs Computer</span>
        </button>
      </div>
    </header>

    <!-- Turn Indicator & Status -->
    <section class="status-section">
      <div id="turn-indicator" class="turn-indicator turn-x" aria-live="polite">
        <div class="turn-pill x-pill active">
          <span class="symbol-x">✕</span>
          <span class="player-label">Player X</span>
        </div>
        <div class="turn-pill o-pill">
          <span class="symbol-o">○</span>
          <span class="player-label" id="player-o-name">Player O</span>
        </div>
      </div>
      <p id="game-message" class="game-message">Player X's turn</p>
    </section>

    <!-- Score Board -->
    <section class="score-board" aria-label="Game Scores">
      <div class="score-card x-score">
        <span class="score-label">X Wins</span>
        <span id="score-x" class="score-val">0</span>
      </div>
      <div class="score-card tie-score">
        <span class="score-label">Ties</span>
        <span id="score-tie" class="score-val">0</span>
      </div>
      <div class="score-card o-score">
        <span class="score-label">O Wins</span>
        <span id="score-o" class="score-val">0</span>
      </div>
    </section>

    <!-- Game Board -->
    <section class="board-wrapper">
      <div id="board" class="board" role="grid" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1" tabindex="0"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2" tabindex="0"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Cell 3" tabindex="0"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="Cell 4" tabindex="0"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="Cell 5" tabindex="0"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="Cell 6" tabindex="0"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="Cell 7" tabindex="0"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="Cell 8" tabindex="0"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="Cell 9" tabindex="0"></button>
      </div>

      <!-- Strike-through winning line SVG -->
      <svg id="winning-strike" class="winning-strike" aria-hidden="true">
        <line id="strike-line" x1="0" y1="0" x2="0" y2="0" stroke="currentColor" stroke-width="4" stroke-linecap="round"></line>
      </svg>
    </section>

    <!-- Action Controls -->
    <footer class="app-actions">
      <button id="restart-btn" class="action-btn primary-action" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Restart Round</span>
      </button>

      <button id="reset-score-btn" class="action-btn secondary-action" type="button" title="Reset all scores to 0">
        <span>Reset Scores</span>
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
